name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install ".[dev]"
      - name: Lint and test risk engine
        run: |
          ruff check .
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dashboard dependencies
        working-directory: apps/web
        run: npm install
      - name: Lint, test, and build dashboard
        working-directory: apps/web
        run: |
          npm run lint
          npm test -- --run
          npm run build
