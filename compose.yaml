services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraudwatch
      POSTGRES_USER: fraudwatch
      POSTGRES_PASSWORD: fraudwatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudwatch -d fraudwatch"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  kafka:
    image: bitnami/kafka:3.9
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-init:
    image: bitnami/kafka:3.9
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -ec '/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud.transactions.v1 --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud.decisions.v1 --partitions 3 --replication-factor 1'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      FRAUDWATCH_DATABASE_URL: postgresql://fraudwatch:fraudwatch@postgres:5432/fraudwatch
      FRAUDWATCH_REDIS_URL: redis://redis:6379/0
      FRAUDWATCH_ALLOW_ORIGIN: http://localhost:5176
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["4200:4200"]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      FRAUDWATCH_DATABASE_URL: postgresql://fraudwatch:fraudwatch@postgres:5432/fraudwatch
      FRAUDWATCH_REDIS_URL: redis://redis:6379/0
      FRAUDWATCH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  producer:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["python", "-m", "apps.worker.producer"]
    environment:
      FRAUDWATCH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FRAUDWATCH_PRODUCER_INTERVAL_SECONDS: "2"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on: [api]
    ports: ["5176:80"]

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: analyst
      GF_SECURITY_ADMIN_PASSWORD: analyst-demo-only
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]

volumes:
  postgres_data:
